version: 1.0.{build}

branches:
  only:
    - stable-win-7

image: Visual Studio 2017

environment:
  matrix:
    - CONFIGURATION: Release
      PLATFORM: Win32

build:
  project: MirrorHook.sln
  parallel: true

before_build:
  - ps: Update-AppveyorBuild -Message "Building branch 'stable-win-7'"

build_script:
  - cmd: msbuild MirrorHook.sln /p:Configuration=Release /p:Platform=x86

artifacts:
  - path: $(SolutionDir)Release\*.*
    name: MirrorHook-artifacts

cache:
  - build_cache -> .vs\MSSolutionProject.json